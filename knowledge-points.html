<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盘古数学知识点深度分析 · AK4-AK9</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg: #f5f7fa;
    --card: #fff;
    --border: #e2e6ea;
    --text: #2c3e50;
    --muted: #7f8c8d;
    --accent: #009688;
    --accent-dark: #00695C;
    --accent-bg: #e0f2f1;
    --wrong: #e53935;
    --right: #43A047;
    --warning: #F57C00;
    --shadow: 0 2px 8px rgba(0,0,0,.06);
}
html, body { height: 100%; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-size: 14px;
}
body.size-small  { font-size: 12px; }
body.size-large  { font-size: 16px; }

/* HEADER */
header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 4px rgba(0,0,0,.04);
    padding: 10px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
}
.header-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}
h1 {
    font-size: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
}
h1 .flag { font-size: 22px; }
.subtitle {
    font-size: 12px;
    background: linear-gradient(135deg, #009688, #26A69A);
    color: #fff;
    padding: 2px 10px;
    border-radius: 10px;
    font-weight: 600;
}
.map-switch {
    display: flex;
    background: #f0f2f5;
    border-radius: 8px;
    padding: 3px;
    gap: 2px;
}
.map-switch a, .map-switch span {
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    text-decoration: none;
    color: var(--muted);
    font-weight: 500;
    white-space: nowrap;
}
.map-switch .active {
    background: #fff;
    color: var(--text);
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
}

.grade-switch, .diff-switch {
    display: flex;
    background: #f0f2f5;
    border-radius: 20px;
    padding: 3px;
    gap: 2px;
}
.grade-switch button, .diff-switch button {
    padding: 6px 14px;
    border: none;
    background: transparent;
    border-radius: 16px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
}
.grade-switch button.active, .diff-switch button.active {
    background: #fff;
    color: var(--text);
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }

.search-box {
    flex: 1;
    min-width: 180px;
    max-width: 320px;
    padding: 7px 14px;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    outline: none;
    background: #fff;
    font-family: inherit;
}
.search-box:focus { border-color: var(--accent); }

.counter-pill {
    padding: 4px 12px;
    background: var(--accent-bg);
    color: var(--accent-dark);
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
}

/* MAIN LAYOUT */
main {
    flex: 1;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 0;
    overflow: hidden;
}
@media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .sidebar { display: none; }
}

.sidebar {
    background: #fff;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
}
.sidebar h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--muted);
    margin: 16px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
}
.sidebar h3:first-child { margin-top: 0; }

.cat-nav-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    gap: 8px;
    transition: background .15s;
    color: var(--text);
    text-decoration: none;
}
.cat-nav-item:hover { background: #f5f7fa; }
.cat-nav-item.active { background: var(--accent-bg); color: var(--accent-dark); font-weight: 600; }
.cat-nav-item .count {
    background: #eceff1;
    color: #607D8B;
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
}
.cat-nav-item.active .count { background: var(--accent-dark); color: #fff; }

.sidebar-stat {
    background: linear-gradient(135deg, #006AA7, #0288D1);
    color: #fff;
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 14px;
}
.sidebar-stat .label { font-size: 11px; opacity: .85; }
.sidebar-stat .big { font-size: 24px; font-weight: 700; margin: 2px 0; }
.sidebar-stat .sub { font-size: 11px; opacity: .85; }

/* CONTENT */
.content {
    overflow-y: auto;
    padding: 20px 24px 60px;
}
.content-inner { max-width: 980px; margin: 0 auto; }

.intro-card {
    background: #fff;
    border-radius: 10px;
    padding: 18px 22px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
    border-left: 4px solid var(--accent);
}
.intro-card h2 { font-size: 18px; margin-bottom: 6px; }
.intro-card p { font-size: 13px; line-height: 1.65; color: #444; }
.intro-card .missing {
    margin-top: 10px;
    padding: 8px 12px;
    background: #fff3e0;
    border-radius: 6px;
    font-size: 12px;
    color: #BF5F00;
}

.topn-card {
    background: linear-gradient(135deg, #fff8e1, #fffde7);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 18px;
    border-left: 4px solid #F9A825;
}
.topn-card h3 { font-size: 14px; margin-bottom: 10px; color: #E65100; }
.topn-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 6px;
    font-size: 12px;
}
.topn-item {
    padding: 6px 10px;
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    gap: 8px;
    align-items: center;
    border: 1px solid #fff3e0;
}
.topn-item:hover { border-color: #F9A825; }
.topn-item .rank { font-weight: 700; color: #E65100; }
.topn-item .count { color: var(--muted); margin-left: auto; }

/* CATEGORY */
.cat {
    background: #fff;
    border-radius: 10px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
    overflow: hidden;
}
.cat-header {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    border-bottom: 1px solid transparent;
    user-select: none;
}
.cat-header:hover { background: #fafcfd; }
.cat.open .cat-header { border-bottom-color: var(--border); }
.cat-header .emoji { font-size: 24px; }
.cat-header .title {
    font-size: 16px;
    font-weight: 700;
    flex: 1;
}
.cat-header .meta {
    display: flex;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
}
.cat-header .meta span {
    padding: 2px 8px;
    background: #f0f2f5;
    border-radius: 10px;
}
.cat-header .caret { color: var(--muted); font-size: 14px; transition: transform .2s; }
.cat.open .cat-header .caret { transform: rotate(90deg); }

.cat-body { display: none; padding: 14px 18px 18px; }
.cat.open .cat-body { display: block; }

.cat-desc {
    font-size: 13px;
    color: #555;
    line-height: 1.6;
    margin-bottom: 10px;
    padding: 8px 12px;
    background: #fafcfd;
    border-radius: 6px;
    border-left: 3px solid var(--accent);
}
.cat-tip {
    font-size: 12px;
    color: #BF5F00;
    line-height: 1.6;
    margin-bottom: 12px;
    padding: 8px 12px;
    background: #fff3e0;
    border-radius: 6px;
}

.cat-strategies {
    margin: 12px 0;
    padding: 10px 12px;
    background: #f8faff;
    border-radius: 6px;
    border-left: 3px solid #42A5F5;
}
.cat-strategies h4 {
    font-size: 12px;
    color: #1565C0;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .3px;
}
.cat-strategies ul { padding-left: 18px; }
.cat-strategies li {
    font-size: 12px;
    line-height: 1.7;
    color: #333;
}
.cat-strategies code {
    background: #e3f2fd;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 11px;
}

/* KNOWLEDGE POINT */
.kp {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 6px;
    overflow: hidden;
    background: #fff;
}
.kp-header {
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    font-size: 13px;
}
.kp-header:hover { background: #fafcfd; }
.kp.open .kp-header { border-bottom: 1px solid var(--border); background: #fafcfd; }
.kp-header .caret { color: var(--muted); font-size: 11px; width: 10px; transition: transform .2s; }
.kp.open .kp-header .caret { transform: rotate(90deg); }
.kp-header .name { flex: 1; font-weight: 600; }
.kp-header .misc-tag {
    font-size: 10px;
    color: #888;
    background: #f0f2f5;
    padding: 1px 6px;
    border-radius: 8px;
    margin-left: 4px;
}
.kp-header .diff { font-size: 11px; color: var(--warning); margin-right: 6px; }
.kp-header .count {
    background: #eceff1;
    color: #455A64;
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
}
.kp-body { display: none; padding: 6px 12px 10px; }
.kp.open .kp-body { display: block; }

/* PROBLEM */
.prob {
    border-left: 3px solid #eee;
    padding: 8px 12px;
    margin: 6px 0;
    background: #fafcfd;
    border-radius: 0 6px 6px 0;
    font-size: 13px;
}
.prob.difficulty-1 { border-left-color: #4CAF50; }
.prob.difficulty-2 { border-left-color: #8BC34A; }
.prob.difficulty-3 { border-left-color: #FFC107; }
.prob.difficulty-4 { border-left-color: #FF9800; }
.prob.difficulty-5 { border-left-color: #F44336; }

.prob-head {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    font-weight: 600;
}
.prob-head:hover { color: var(--accent); }
.prob-head .stars { color: var(--warning); font-size: 11px; letter-spacing: 1px; }
.prob-head .id {
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 11px;
    color: var(--muted);
    background: #fff;
    padding: 1px 6px;
    border-radius: 3px;
    border: 1px solid #eee;
}
.prob-head .meta { color: var(--muted); font-size: 11px; font-weight: 400; margin-left: auto; }
.prob-head .caret { color: var(--muted); font-size: 11px; width: 10px; }
.prob.open .prob-head .caret { transform: rotate(90deg); }

.prob-body { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ddd; }
.prob.open .prob-body { display: block; }

.prob-question {
    font-size: 13px;
    line-height: 1.65;
    color: #333;
    margin-bottom: 8px;
    padding: 8px 10px;
    background: #fff;
    border-radius: 4px;
    white-space: pre-wrap;
}
.prob-options {
    margin: 6px 0;
    font-size: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}
.prob-opt {
    padding: 3px 10px;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 12px;
}
.prob-opt.correct {
    background: #e8f5e9;
    color: #1B5E20;
    border-color: #a5d6a7;
    font-weight: 700;
}
.prob-answer {
    display: inline-block;
    padding: 3px 10px;
    background: #c8e6c9;
    color: #1B5E20;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;
    margin: 4px 6px 4px 0;
}
.prob-hint {
    background: #fff8e1;
    border-left: 3px solid #F9A825;
    padding: 7px 10px;
    border-radius: 0 4px 4px 0;
    font-size: 12px;
    line-height: 1.55;
    color: #4E342E;
    margin-top: 6px;
    white-space: pre-wrap;
}

.hidden { display: none !important; }

.empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
}

.loading {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    font-size: 15px;
}

/* TEXTBOOK LINK CARDS */
.textbook-section {
    margin-top: 12px;
    padding: 10px 12px;
    background: linear-gradient(135deg, #f3e5f5, #fce4ec);
    border-radius: 6px;
    border-left: 3px solid #9C27B0;
}
.textbook-section h4 {
    font-size: 12px;
    color: #6A1B9A;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .3px;
}
.textbook-section .no-match {
    font-size: 12px;
    color: #999;
    font-style: italic;
}
.tb-item {
    background: #fff;
    border-radius: 6px;
    margin: 6px 0;
    overflow: hidden;
    border: 1px solid #e8d5ec;
}
.tb-head {
    padding: 7px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    font-size: 12px;
}
.tb-head:hover { background: #faf5fc; }
.tb-item.open .tb-head { background: #f8edfa; border-bottom: 1px solid #e8d5ec; }
.tb-head .caret { color: #9C27B0; font-size: 10px; width: 10px; transition: transform .2s; }
.tb-item.open .tb-head .caret { transform: rotate(90deg); }
.tb-head .grade-badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
}
.tb-head .grade-3 { background: #4CAF50; }
.tb-head .grade-4 { background: #2196F3; }
.tb-head .grade-5 { background: #FF9800; }
.tb-head .grade-6 { background: #9C27B0; }
.tb-head .name { flex: 1; font-weight: 600; color: #333; }
.tb-head .lectures {
    font-size: 10px;
    color: #999;
    background: #f0f2f5;
    padding: 1px 6px;
    border-radius: 8px;
}
.tb-body { display: none; padding: 8px 12px 10px; font-size: 12px; }
.tb-item.open .tb-body { display: block; }
.tb-desc { color: #555; line-height: 1.6; margin-bottom: 8px; }
.tb-sect { margin: 8px 0; }
.tb-sect-title {
    font-size: 11px;
    font-weight: 700;
    color: #6A1B9A;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: .3px;
}
.tb-sect ul { padding-left: 18px; margin: 2px 0; }
.tb-sect li { line-height: 1.65; color: #333; margin-bottom: 2px; }
.tb-example {
    background: #f8faff;
    border-left: 2px solid #42A5F5;
    padding: 6px 10px;
    margin: 4px 0;
    border-radius: 0 4px 4px 0;
}
.tb-example b { color: #1565C0; }
.tb-example-sol {
    color: #555;
    margin-top: 3px;
    font-size: 11px;
    line-height: 1.65;
}
.tb-exercise {
    padding: 4px 10px;
    background: #fffde7;
    border-left: 2px solid #F9A825;
    margin: 3px 0;
    border-radius: 0 4px 4px 0;
    color: #4E342E;
    line-height: 1.55;
}
.tb-tip { color: #666; font-size: 11px; line-height: 1.6; }

/* Scrollbar polish */
.sidebar::-webkit-scrollbar, .content::-webkit-scrollbar { width: 8px; }
.sidebar::-webkit-scrollbar-thumb, .content::-webkit-scrollbar-thumb {
    background: #cfd8dc; border-radius: 4px;
}
</style>
</head>

<header>
    <div class="header-row">
        <h1><span class="flag">📊</span> 知识点深度分析</h1>
        <span class="subtitle">AK4-AK9 盘古竞赛</span>
        <div class="map-switch">
            <a href="index.html">📐 小学教材</a>

    </div>
</header>

<main>
    <aside class="sidebar">
        <div class="sidebar-stat" id="sidebar-stat">
            <div class="label">当前筛选</div>

<script>
// ===================== TOPIC META =====================
// Must mirror _tools/knowledge_report.js (same clustering rules).
const TOPIC_META = [
    {
        key: 'pangu_calc', label: '基础运算', emoji: '🧮',
        desc: '四则运算、运算顺序、速算技巧、单位换算、以及运算的陷阱题',
        strategies: [
            '<b>运算顺序</b>：括号 → 乘除 → 加减；同级从左到右',
            '<b>速算技巧</b>：配对消项（1−2+3−4+… 两两配对），凑整法（25×4、125×8），逆运算补数',
            '<b>单位换算</b>：时间（1时=60分=3600秒）、长度（m/cm/mm/km）、体积（L/ml/dl）、重量（kg/g）',
            '<b>陷阱警觉</b>：读清"从 A 中减 B"的方向、"是 A 的几倍" vs "比 A 多几倍"',
            '<b>估算验证</b>：答案与数量级是否合理'
        ],
        clusters: [
            { name: '交替加减/配对求和', patterns: [/交替/, /正负/, /加减$/, /\+\s*\d+\s*-\s*\d+/, /望远/] },
            { name: '等差连加（1+3+…）', patterns: [/\d+\+\d+\+[.…]/, /\d+\+\d+\+\d+\+/, /奇数.*求和/, /奇数.*之和/, /偶数.*求和/, /连.*加/, /1\.\.1000/] },
            { name: '多步混合运算', patterns: [/算式求值/, /算式谜/, /和中减/, /两数之和/, /两数的[商和差积]/, /算式/, /计算 ?\d/, /值$/, /从.*中.*减/] },
            { name: '单位换算', patterns: [/换算/, /\d+ ?(ml|L|cm|m|km|kg|g|分钟|秒|小时|dl)/, /升.*ml/, /\d+ ?升/, /千克|公斤/] },
            { name: '运算符判断/填符号', patterns: [/运算符/, /填符号/, /填.*运算/, /\?/, /□/, /^.*\?.*=/] },
            { name: '乘法表/乘法基础', patterns: [/乘法/, /乘积/, /\d+×\d+/, /\d+ ?[·\.] ?\d+/, /倒数|逆运算/] },
            { name: '逆推/估算', patterns: [/估算/, /大约/, /量级/, /逆推/, /倒推/, /结果.*是/, /\?.*=/] },
        ]

// ===================== STATE =====================
let currentGrade = 4;
let currentDiff = 'all';
let currentCategory = null;   // key or null
let searchTerm = '';
let allProblems = [];
let kpData = {}; // {topicKey: {clusterName: [problems]}}
let textbookMap = {}; // textbook topic id -> node
let panguToTextbook = {}; // pangu topic key -> array of textbook topic ids

// ===================== DATA LOADING =====================
function inferGrade(file) {
    if (/ü0ç3k4|Ak4|AK4/.test(file)) return 4;
    if (/ü0ç3k5|Ak5|AK5/.test(file)) return 5;
    if (/ü0ç3k6|Ak6|AK6/.test(file)) return 6;
    if (/ü0ç3k7|Ak7|AK7/.test(file)) return 7;
    if (/ü0ç3k8|Ak8|AK8/.test(file)) return 8;
    if (/ü0ç3k9|Ak9|AK9/.test(file)) return 9;
    return 0;
}

function clusterTitle(topic, title) {
    const meta = TOPIC_META.find(m => m.key === topic);
    if (!meta) return ['综合应用（独立题型）'];
    const hits = [];
    for (const cl of meta.clusters) {
        if (cl.patterns.some(re => re.test(title))) hits.push(cl.name);
    }
    return hits.length ? hits : ['综合应用（独立题型）'];
}

function buildData() {
    if (typeof panguProblems === 'undefined') return false;
    allProblems = panguProblems.map(p => ({ ...p, _grade: inferGrade(p.file || '') }));
    // Build textbook lookup
    if (typeof knowledgeNodes !== 'undefined') {
        knowledgeNodes.forEach(n => { textbookMap[n.id] = n; });
    }
    // Build pangu topic -> textbook mapping
    if (typeof panguNodes !== 'undefined') {
        panguNodes.forEach(n => {
            panguToTextbook[n.id] = n.linkedElementary || [];
        });
    }
    return true;
}

function recomputeKP() {
    // Filter problems by current grade
    const filtered = allProblems.filter(p => p._grade === currentGrade);
    kpData = {};
    filtered.forEach(p => {
        (p.topics || []).forEach(topic => {
            const clusters = clusterTitle(topic, p.title || '');
            clusters.forEach(cn => {
                kpData[topic] = kpData[topic] || {};
                kpData[topic][cn] = kpData[topic][cn] || [];
                kpData[topic][cn].push(p);
            });
        });
    });
}

// ===================== FILTERING =====================
function matchesFilter(p) {
    if (currentDiff !== 'all' && p.difficulty !== parseInt(currentDiff)) return false;
    if (searchTerm) {
        const q = searchTerm.toLowerCase();
        const hay = ((p.title||'') + ' ' + (p.translation||'') + ' ' + (p.id||'') + ' ' + (p.hint||'')).toLowerCase();
        if (!hay.includes(q)) return false;
    }
    return true;
}

// ===================== RENDER =====================
function renderGradeSwitch() {
    const el = document.getElementById('grade-switch');
    const counts = { 4:0, 5:0, 6:0, 7:0, 8:0, 9:0 };
    allProblems.forEach(p => { if (counts[p._grade] !== undefined) counts[p._grade]++; });
    el.innerHTML = [4,5,6,7,8,9].map(g => `
        <button data-grade="${g}" class="${g === currentGrade ? 'active' : ''}" onclick="setGrade(${g})">
            AK${g} <small style="opacity:.6">${counts[g]}</small>
        </button>
    `).join('');
}

function renderSidebar() {
    const nav = document.getElementById('cat-nav');
    // Compute per-category counts (filtered by current difficulty+search)
    const catCounts = {};
    Object.entries(kpData).forEach(([topic, clusters]) => {
        catCounts[topic] = 0;
        Object.values(clusters).forEach(arr => arr.forEach(p => { if (matchesFilter(p)) catCounts[topic]++; }));
    });
    const items = TOPIC_META
        .map(m => ({ meta: m, count: catCounts[m.key] || 0 }))
        .filter(x => x.count > 0)
        .sort((a,b) => b.count - a.count);

    nav.innerHTML = items.map(({ meta, count }) =>
        `<a class="cat-nav-item ${currentCategory === meta.key ? 'active' : ''}" onclick="jumpToCat('${meta.key}')">
            <span>${meta.emoji} ${meta.label}</span>
            <span class="count">${count}</span>
        </a>`
    ).join('');

    // Stat panel
    const filteredCount = Object.values(catCounts).reduce((s,n) => s+n, 0);
    const grade = currentGrade;
    const gradeProblemCount = allProblems.filter(p => p._grade === grade).length;
    document.getElementById('stat-total').textContent = gradeProblemCount;
    document.getElementById('stat-sub').textContent = `AK${grade} 题库 · ${items.length} 大类`;
}

function renderCounter() {
    const totalMatchingProblems = new Set();
    Object.values(kpData).forEach(clusters => {
        Object.values(clusters).forEach(arr => arr.forEach(p => { if (matchesFilter(p)) totalMatchingProblems.add(p.id); }));
    });
    const txt = `当前显示 ${totalMatchingProblems.size} 题`;
    document.getElementById('counter').textContent = txt;
}

            if (/综合应用/.test(cn)) return;
            const filtered = arr.filter(matchesFilter);
            if (!filtered.length) return;
            const meta = TOPIC_META.find(m => m.key === topic);
            allClusters.push({ name: cn, meta, count: filtered.length });
        });
    });
    allClusters.sort((a,b) => b.count - a.count);
    const topN = allClusters.slice(0, 20);
    if (topN.length) {
        html += `<div class="topn-card" id="topn-card">
            <h3>🏆 AK${currentGrade} 高频核心知识点 Top ${topN.length}</h3>
            <div class="topn-list">
                ${topN.map((c, i) => `
                    <div class="topn-item" onclick="jumpToKP('${c.meta.key}', ${JSON.stringify(c.name)})">
                        <span class="rank">#${i+1}</span>
                        <span>${c.meta.emoji} ${c.name}</span>
                        <span class="count">${c.count}题</span>
                    </div>
                `).join('')}
            </div>
        </div>`;
    }

    // Categories
    const sortedTopics = Object.entries(kpData)
        .map(([topic, clusters]) => {
            const meta = TOPIC_META.find(m => m.key === topic);
            const problems = [];
            Object.values(clusters).forEach(arr => arr.forEach(p => { if (matchesFilter(p)) problems.push(p); }));
            return { topic, meta, clusters, count: problems.length };
        })
        .filter(x => x.count > 0 && x.meta)
        .sort((a,b) => b.count - a.count);

    sortedTopics.forEach(({ topic, meta, clusters, count }) => {
        const tip = (info.tipPerCategory && info.tipPerCategory[topic]) || '';
        const isOpen = currentCategory === topic;
        html += `<div class="cat ${isOpen ? 'open' : ''}" id="cat-${topic}">
            <div class="cat-header" onclick="toggleCat('${topic}')">
                <span class="emoji">${meta.emoji}</span>
                <span class="title">${meta.label}</span>
                <span class="meta">
                    <span>${count} 题</span>
                    <span>${Object.keys(clusters).length} 个知识点</span>
                </span>
                <span class="caret">▸</span>
            </div>
            <div class="cat-body">
                <div class="cat-desc">${meta.desc}</div>
                ${tip ? `<div class="cat-tip">💡 <b>AK${currentGrade} 定位</b>：${tip}</div>` : ''}
                <div class="cat-strategies">
                    <h4>🧭 解题策略</h4>
                    <ul>${meta.strategies.map(s => `<li>${s}</li>`).join('')}</ul>
                </div>
                ${renderTextbookLinks(topic)}
                ${renderKPs(clusters)}
            </div>
        </div>`;
    });

    el.innerHTML = html;
}

function renderTextbookLinks(topicKey) {
    const linkedIds = panguToTextbook[topicKey] || [];
    const linked = linkedIds.map(id => textbookMap[id]).filter(Boolean);
    if (linked.length === 0) {
        return `<div class="textbook-section">
            <h4>📘 对应小学教材</h4>
            <div class="no-match">本大类在小学教材中暂无直接对应章节（可能是初中/竞赛专属内容）</div>
        </div>`;
    }
    // Group by grade for cleaner display
    linked.sort((a,b) => a.grade - b.grade);
    return `<div class="textbook-section">
        <h4>📘 对应小学教材（${linked.length} 讲，点击展开）</h4>
        ${linked.map(renderTextbookItem).join('')}
    </div>`;
}

function renderTextbookItem(n) {
    const kpList = (n.keyPoints || []).map(k => `<li>${escapeHtml(k)}</li>`).join('');
    const examples = (n.examples || []).map(e => `
        <div class="tb-example">
            <b>${escapeHtml(e.title || '例题')}</b>: ${escapeHtml(e.question || '')}
            ${e.solution ? `<div class="tb-example-sol"><b>解</b>: ${escapeHtml(e.solution).replace(/\n/g, '<br>')}</div>` : ''}
        </div>
    `).join('');
    const exercises = (n.exercises || []).map((e, i) => `
        <div class="tb-exercise">${i+1}. ${escapeHtml(e)}</div>
    `).join('');
    const tips = (n.tips || []).map(t => `<li>${escapeHtml(t)}</li>`).join('');

    return `<div class="tb-item" data-tbid="${n.id}">
        <div class="tb-head" onclick="toggleTB(this)">
            <span class="caret">▸</span>
            <span class="grade-badge grade-${n.grade}">${n.grade}年级</span>
            <span class="name">${escapeHtml(n.name || '')}</span>
            ${n.lectures ? `<span class="lectures">${escapeHtml(n.lectures)}</span>` : ''}
        </div>
        <div class="tb-body">
            ${n.description ? `<div class="tb-desc">${escapeHtml(n.description)}</div>` : ''}
            ${kpList ? `<div class="tb-sect"><div class="tb-sect-title">📌 关键知识点</div><ul>${kpList}</ul></div>` : ''}
            ${examples ? `<div class="tb-sect"><div class="tb-sect-title">💡 例题</div>${examples}</div>` : ''}
            ${exercises ? `<div class="tb-sect"><div class="tb-sect-title">✏️ 练习题</div>${exercises}</div>` : ''}
            ${tips ? `<div class="tb-sect"><div class="tb-sect-title">🎯 讲解提示</div><ul class="tb-tip">${tips}</ul></div>` : ''}
            <div style="font-size:10px;color:#aaa;margin-top:8px;">📖 教材 ID: ${n.id}</div>
        </div>
    </div>`;
}

function toggleTB(headerEl) {
    const item = headerEl.closest('.tb-item');
    item.classList.toggle('open');
}

function renderKPs(clusters) {
    const sorted = Object.entries(clusters)
        .map(([name, arr]) => ({ name, problems: arr.filter(matchesFilter) }))
        .filter(x => x.problems.length > 0)
        .sort((a,b) => {
            if (/综合应用/.test(a.name)) return 1;
            if (/综合应用/.test(b.name)) return -1;
            return b.problems.length - a.problems.length;
        });

    return sorted.map(({ name, problems }) => {
        const isMisc = /综合应用/.test(name);
        const diffs = problems.map(p => p.difficulty).filter(Boolean);
        const diffRange = diffs.length ? `${Math.min(...diffs)}-${Math.max(...diffs)}⋆` : '';
        return `<div class="kp" data-kpname="${encodeURIComponent(name)}">
            <div class="kp-header" onclick="toggleKP(this)">
                <span class="caret">▸</span>
                <span class="name">${name}${isMisc ? '<span class="misc-tag">独立题型</span>' : ''}</span>
                <span class="diff">${diffRange}</span>
                <span class="count">${problems.length} 题</span>
            </div>
            <div class="kp-body">${problems.map(renderProblem).join('')}</div>
        </div>`;
    }).join('');
}

function renderProblem(p) {
    const stars = '⋆'.repeat(p.difficulty||0);
    const answerIdx = p.answer ? (p.answer.toLowerCase().charCodeAt(0) - 97) : -1;
    const options = (p.options || []).map((opt, i) =>
        `<span class="prob-opt ${i === answerIdx ? 'correct' : ''}">
            ${String.fromCharCode(97+i)}) ${escapeHtml(opt)}
        </span>`
    ).join('');
    const question = escapeHtml(p.translation || '').replace(/\n/g, '<br>');
    const hint = escapeHtml(p.hint || '').replace(/\n/g, '<br>');

    return `<div class="prob difficulty-${p.difficulty||3}">
        <div class="prob-head" onclick="toggleProb(this)">
            <span class="caret">▸</span>
            <span class="stars">${stars}</span>
            <span>${escapeHtml(p.title || '')}</span>
            <span class="id">${p.id}</span>
            <span class="meta">${p.year} ${p.round}</span>
        </div>
        <div class="prob-body">
            <div class="prob-question">${question}</div>
            ${options ? `<div class="prob-options">${options}</div>` : ''}
            ${p.answer ? `<span class="prob-answer">✓ 答案：${p.answer}</span>` : ''}
            ${hint ? `<div class="prob-hint"><b>💡 思路</b>：${hint}</div>` : ''}
            ${p.file ? `<div style="font-size:11px;color:#999;margin-top:6px;">📄 ${escapeHtml(p.file)}${p.page ? ` · 第 ${p.page} 页` : ''}</div>` : ''}
        </div>
    </div>`;
}

function escapeHtml(s) {
    return String(s||'').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ===================== UI ACTIONS =====================
function setGrade(g) {
    currentGrade = g;
    currentCategory = null;
    recomputeKP();
    renderGradeSwitch();
    renderSidebar();
    renderContent();
    renderCounter();
    document.querySelector('.content').scrollTop = 0;
}

function setDiff(d) {
    currentDiff = d;
    document.querySelectorAll('#diff-switch button').forEach(b =>
        b.classList.toggle('active', b.dataset.diff === d));
    renderSidebar();
    renderContent();
    renderCounter();
}

function toggleCat(topic) {
    currentCategory = currentCategory === topic ? null : topic;
    const el = document.getElementById('cat-' + topic);
    if (el) el.classList.toggle('open', currentCategory === topic);
    renderSidebar();
}

function jumpToCat(topic) {
    currentCategory = topic;
    renderContent();
    renderSidebar();
    setTimeout(() => {
        const el = document.getElementById('cat-' + topic);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 50);
}

function jumpToKP(topic, kpName) {
    currentCategory = topic;
    renderContent();
    renderSidebar();
    setTimeout(() => {
        const catEl = document.getElementById('cat-' + topic);
        if (!catEl) return;
        const kp = catEl.querySelector(`.kp[data-kpname="${encodeURIComponent(kpName)}"]`);
        if (kp) {
            kp.classList.add('open');
            kp.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }, 100);
}

function toggleKP(headerEl) {
    const kp = headerEl.closest('.kp');
    kp.classList.toggle('open');
}

function toggleProb(headerEl) {
    const prob = headerEl.closest('.prob');
    prob.classList.toggle('open');
}

function expandAllCats() {
    document.querySelectorAll('.cat').forEach(el => el.classList.add('open'));
}
function collapseAllCats() {
    document.querySelectorAll('.cat').forEach(el => el.classList.remove('open'));
    document.querySelectorAll('.kp').forEach(el => el.classList.remove('open'));
    document.querySelectorAll('.prob').forEach(el => el.classList.remove('open'));
}
function scrollToTopN() {
    document.querySelector('.content').scrollTop = 0;
    const card = document.getElementById('topn-card');
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ===================== INIT =====================
let searchTimer = null;
document.getElementById('search').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
        searchTerm = e.target.value.trim();
        renderSidebar();
        renderContent();
        renderCounter();
    }, 200);
});

document.querySelectorAll('#diff-switch button').forEach(b => {
    b.addEventListener('click', () => setDiff(b.dataset.diff));
});

function init() {
    if (!buildData()) {
        document.getElementById('main-content').innerHTML =
            '<div class="empty-state">❌ 无法加载 pangu-data.js，请确认文件存在。</div>';
        return;
    }
    recomputeKP();
    renderGradeSwitch();
    renderSidebar();
    renderContent();
    renderCounter();
}

// Wait for pangu-data.js to load
if (typeof panguProblems !== 'undefined') {
    init();
} else {
    window.addEventListener('load', init);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识关联视图 · 小学教材 ↔ 德国竞赛</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航栏 -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">&#x1F517;</span>
                <h1>知识关联视图</h1>
                <span class="subtitle subtitle-bridge">小学教材 ↔ 德国竞赛</span>
            </div>

            <!-- 图谱切换（四选） -->
            <div class="map-switch">
                <a class="map-switch-btn" href="index.html" title="小学教材知识图谱">
                    &#x1F4D0; 小学教材
                </a>
                <a class="map-switch-btn" href="german.html" title="德国竞赛知识图谱">
                    &#x1F3C6; 德国竞赛
                </a>
                <a class="map-switch-btn" href="pangu.html" title="盘古竞赛知识图谱（含中文翻译）">
                    &#x1F3A8; 盘古竞赛
                </a>
                <span class="map-switch-btn active">
                    &#x1F517; 关联视图
                </span>
            </div>

            <nav class="nav-tabs">
                <button class="tab-btn active" data-view="graph" onclick="switchView('graph')">关联图谱</button>
                <button class="tab-btn" data-view="table" onclick="switchView('table')">对照表</button>
            </nav>

            <div class="grade-filter">
                <button class="grade-btn active" data-grade="all" onclick="filterGrade('all')">全部</button>
                <button class="grade-btn" data-grade="k3" onclick="filterGrade('k3')">K3 相关</button>
                <button class="grade-btn" data-grade="k4" onclick="filterGrade('k4')">K4 相关</button>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 关联图谱视图 -->
            <div class="view-panel active" id="graph-view">
                <div class="graph-container">
                    <svg id="knowledge-graph"></svg>
                </div>
                <div class="graph-legend">
                    <h3>节点</h3>
                    <div class="legend-item"><span class="dot grade3"></span> 小学 3-6 年级知识点</div>
                    <div class="legend-item"><span class="dot bridge-german"></span> 德国竞赛 K3/K4 主题</div>
                    <hr>
                    <h3>连线</h3>
                    <div class="legend-item"><span class="line-cross"></span> 跨图关联</div>
                    <hr>
                    <p class="legend-tip">
                        左列：小学教材知识点<br>
                        右列：德国竞赛主题<br>
                        虚线：跨图关联<br>
                        <br>
                        点击节点查看关联详情<br>
                        滚轮缩放 · 拖拽移动
                    </p>
                </div>
                <div class="bridge-stats" id="bridge-stats"></div>
            </div>

            <!-- 对照表视图 -->
            <div class="view-panel" id="table-view">
                <div class="table-container" id="correlation-table"></div>
            </div>
        </main>

        <!-- 详情面板 -->
        <div class="detail-overlay" id="detail-overlay" onclick="closeDetail()"></div>
        <aside class="detail-panel" id="detail-panel">
            <button class="close-btn" onclick="closeDetail()">&times;</button>
            <div class="detail-content" id="detail-content">
                <div class="empty-state">
                    <p>&#x1F449; 点击图谱中的节点查看关联</p>
                </div>
            </div>
        </aside>
    </div>

    <script src="data.js"></script>
    <script src="german-data.js"></script>
    <script src="bridge-app.js"></script>
</body>
</html>

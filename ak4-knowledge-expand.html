<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AK4 知识点扩展教学 · 盘古数学</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg: #f5f7fa;
    --card: #fff;
    --border: #e2e6ea;
    --text: #2c3e50;
    --muted: #7f8c8d;
    --accent: #009688;
    --accent-dark: #00695C;
    --accent-bg: #e0f2f1;
    --primary-grad-1: #6A1B9A;
    --primary-grad-2: #4527A0;
    --shadow: 0 2px 8px rgba(0,0,0,.06);
}
html, body { height: 100%; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    font-size: 14px;
}

/* HEADER */
header {
    background: linear-gradient(135deg, var(--primary-grad-1), var(--primary-grad-2));
    color: #fff;
    padding: 24px 24px 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,.1);
    position: sticky;
    top: 0;
    z-index: 100;
}
.hd-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    max-width: 1200px;
    margin: 0 auto;
}
header h1 {
    font-size: 22px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
}
header .sub {
    font-size: 13px;
    opacity: .85;
    padding: 3px 12px;
    background: rgba(255,255,255,.15);
    border-radius: 12px;
    backdrop-filter: blur(4px);
}
.map-switch {
    display: flex;
    background: rgba(0,0,0,.2);
    border-radius: 8px;
    padding: 3px;
    gap: 2px;
    margin-left: auto;
}
.map-switch a, .map-switch span {
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    text-decoration: none;
    color: rgba(255,255,255,.75);
    font-weight: 500;
    white-space: nowrap;
}
.map-switch .active {
    background: rgba(255,255,255,.95);
    color: #4527A0;
}

.toc {
    max-width: 1200px;
    margin: 16px auto 0;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
}
.toc a {
    padding: 6px 12px;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 16px;
    color: #fff;
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    transition: all .15s;
    backdrop-filter: blur(4px);
}
.toc a:hover {
    background: rgba(255,255,255,.3);
    border-color: rgba(255,255,255,.5);
}

/* MAIN */
main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px 24px 100px;
}

.intro {
    background: #fff;
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--accent);
}
.intro h2 { font-size: 18px; margin-bottom: 8px; }
.intro p { font-size: 14px; line-height: 1.75; color: #555; }
.intro .highlight {
    background: #FFF8E1;
    padding: 1px 8px;
    border-radius: 4px;
    font-weight: 600;
    color: #BF360C;
}

/* CATEGORY */
.cat {
    background: #fff;
    border-radius: 12px;
    margin-bottom: 18px;
    overflow: hidden;
    box-shadow: var(--shadow);
    scroll-margin-top: 180px;
}
.cat-head {
    padding: 16px 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    user-select: none;
    background: linear-gradient(135deg, #fafbfc, #ffffff);
    border-bottom: 1px solid var(--border);
}
.cat-head:hover { background: linear-gradient(135deg, #f0f4f8, #fafbfc); }
.cat-head .emoji { font-size: 28px; }
.cat-head .ti {
    font-size: 18px;
    font-weight: 700;
    flex: 1;
}
.cat-head .meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 6px;
}
.cat-head .meta span {
    padding: 2px 8px;
    background: #eceff1;
    border-radius: 10px;
}
.cat-head .caret {
    font-size: 16px;
    color: var(--muted);
    transition: transform .2s;
}
.cat.open .cat-head .caret { transform: rotate(90deg); }
.cat-body { display: none; padding: 16px 22px 22px; }
.cat.open .cat-body { display: block; }

.cat-overview {
    background: #f8faff;
    border-left: 3px solid #42A5F5;
    padding: 12px 16px;
    border-radius: 6px;
    margin-bottom: 14px;
    font-size: 13px;
    line-height: 1.75;
    color: #333;
}
.cat-overview b { color: #0D47A1; }

.cat-strategies {
    background: #fff8e1;
    border-left: 3px solid #F9A825;
    padding: 12px 16px;
    border-radius: 6px;
    margin-bottom: 16px;
}
.cat-strategies h4 {
    font-size: 12px;
    color: #E65100;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 6px;
}
.cat-strategies ul { padding-left: 20px; margin: 0; }
.cat-strategies li {
    font-size: 13px;
    line-height: 1.75;
    color: #333;
    margin-bottom: 2px;
}
.cat-strategies b { color: #BF360C; }

/* KNOWLEDGE POINT */
.kp {
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
    overflow: hidden;
    background: #fff;
}
.kp-head {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    font-size: 15px;
    background: #fff;
}
.kp-head:hover { background: #fafcfd; }
.kp.open .kp-head { background: linear-gradient(90deg, #e0f2f1 0%, #fff 100%); border-bottom: 1px solid var(--border); }
.kp-head .idx {
    width: 24px;
    height: 24px;
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
}
.kp-head .name { font-weight: 700; flex: 1; }
.kp-head .count {
    font-size: 11px;
    color: var(--muted);
    background: #f0f2f5;
    padding: 2px 8px;
    border-radius: 10px;
}
.kp-head .caret { color: var(--muted); font-size: 12px; transition: transform .2s; }
.kp.open .kp-head .caret { transform: rotate(90deg); }

.kp-body { display: none; padding: 12px 16px 16px; }
.kp.open .kp-body { display: block; }

.kp-analysis {
    background: #e8f5e9;
    border-left: 3px solid #43A047;
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 10px;
    font-size: 13px;
    line-height: 1.7;
    color: #1B5E20;
}
.kp-analysis h5 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .3px;
    color: #2E7D32;
    margin-bottom: 4px;
}
.kp-tips {
    background: #e3f2fd;
    border-left: 3px solid #42A5F5;
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 12px;
    font-size: 13px;
}
.kp-tips h5 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .3px;
    color: #1565C0;
    margin-bottom: 4px;
}
.kp-tips ol, .kp-tips ul { padding-left: 20px; margin: 2px 0; }
.kp-tips li { line-height: 1.7; margin-bottom: 2px; }
.kp-tips b { color: #0D47A1; }

/* EXAMPLES */
.ex {
    background: #fff;
    border: 1px solid #e8d5ec;
    border-left: 3px solid #9C27B0;
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
    margin-bottom: 10px;
}
.ex-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
}
.ex-badge {
    background: #9C27B0;
    color: #fff;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
}
.ex-stars { color: #F9A825; font-size: 11px; letter-spacing: 1.5px; }
.ex-title {
    font-weight: 700;
    font-size: 14px;
    flex: 1;
    color: #333;
}
.ex-q {
    background: #faf5fc;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1.75;
    margin-bottom: 10px;
    color: #212121;
    white-space: pre-wrap;
}
.ex-q b { color: #6A1B9A; }

.ex-steps {
    background: #fffde7;
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 8px;
    font-size: 13px;
    line-height: 1.75;
}
.ex-steps h6 {
    font-size: 11px;
    color: #E65100;
    text-transform: uppercase;
    letter-spacing: .3px;
    margin-bottom: 6px;
    font-weight: 700;
}
.ex-steps ol { padding-left: 20px; margin: 0; }
.ex-steps li { margin-bottom: 4px; color: #4E342E; }
.ex-steps li b { color: #BF360C; }
.ex-steps code {
    background: #fff;
    padding: 1px 6px;
    border-radius: 3px;
    color: #BF360C;
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 12px;
    border: 1px solid #ffe082;
}

.ex-ans {
    display: inline-block;
    background: #c8e6c9;
    color: #1B5E20;
    padding: 4px 12px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 13px;
    margin: 4px 0;
}
.ex-takeaway {
    background: #fff8e1;
    border-left: 3px solid #FFC107;
    padding: 7px 12px;
    border-radius: 0 4px 4px 0;
    font-size: 12px;
    color: #4E342E;
    line-height: 1.65;
    margin-top: 8px;
}
.ex-takeaway b { color: #BF360C; }

.practice {
    background: linear-gradient(135deg, #f3e5f5, #ede7f6);
    border-radius: 8px;
    padding: 12px 16px;
    margin-top: 10px;
}
.practice h5 {
    font-size: 12px;
    color: #4527A0;
    text-transform: uppercase;
    letter-spacing: .3px;
    margin-bottom: 6px;
    font-weight: 700;
}
.practice ol { padding-left: 20px; margin: 0; }
.practice li {
    font-size: 13px;
    line-height: 1.75;
    color: #311B92;
    margin-bottom: 3px;
}

/* ============== PRINT TOOLBAR ============== */
.print-bar {
    position: sticky;
    top: 0;
    z-index: 90;
    background: linear-gradient(90deg, #FFF3E0, #FFE0B2);
    border-bottom: 1px solid #FFCC80;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 13px;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
}
.print-bar b { color: #BF360C; }
.print-bar .hint { color: #6D4C41; font-size: 12px; }
.print-btn {
    padding: 7px 14px;
    background: #E65100;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}
.print-btn:hover { background: #BF360C; }
.print-btn.secondary {
    background: #fff;
    color: #BF360C;
    border: 1.5px solid #BF360C;
}
.print-btn.secondary:hover { background: #FFF3E0; }
.print-select {
    padding: 6px 12px;
    border: 1.5px solid #FFCC80;
    border-radius: 6px;
    background: #fff;
    font-size: 13px;
    color: #4E342E;
    font-family: inherit;
    cursor: pointer;
}
body.print-filter-no-practice .practice { display: none !important; }
body.print-filter-no-takeaway .ex-takeaway { display: none !important; }
body.print-filter-no-tips .kp-tips { display: none !important; }
body.print-filter-no-overview .cat-overview, body.print-filter-no-overview .intro { display: none !important; }
/* 试卷模式：隐藏答案、解题步骤、要点 */
body.print-hide-answers .ex-steps,
body.print-hide-answers .ex-ans,
body.print-hide-answers .ex-takeaway { display: none !important; }
/* 试卷模式下给每道题留出答题空间 */
body.print-hide-answers .ex { min-height: 90px; padding-bottom: 20px !important; }
body.print-hide-answers .ex::after {
    content: '答：________________________________________';
    display: block;
    margin-top: 10px;
    color: #999;
    font-size: 11pt;
    letter-spacing: 2px;
}

/* Hide elements marked for print-exclusion (works for screen too, just dim) */
.print-hidden {
    opacity: .3;
}
@media print {
    .print-hidden { display: none !important; }
}

/* ============== PRINT STYLES ============== */
@media print {
    @page {
        size: A4 portrait;
        margin: 15mm 12mm;
    }
    html, body {
        height: auto !important;
        overflow: visible !important;
        background: #fff !important;
        font-size: 11pt !important;
        line-height: 1.5 !important;
    }
    header {
        position: static !important;
        background: #fff !important;
        color: #000 !important;
        padding: 0 0 10px 0 !important;
        box-shadow: none !important;
        border-bottom: 2px solid #333 !important;
        margin-bottom: 10px;
    }
    header h1 { font-size: 16pt !important; margin: 0 !important; }
    header .sub { background: #eee !important; color: #000 !important; padding: 2px 8px !important; }
    .map-switch, .toc, .print-bar { display: none !important; }

    main { padding: 0 !important; max-width: 100% !important; }
    .intro { background: #fff !important; border-left: 3px solid #333 !important; box-shadow: none !important;
             padding: 8px 12px !important; margin-bottom: 10px !important; page-break-after: avoid; }
    .intro h2 { font-size: 13pt !important; }
    .intro p { font-size: 10pt !important; }
    .intro .highlight { background: transparent !important; color: #000 !important; font-weight: 700; }

    /* Expand everything */
    .cat-body, .kp-body { display: block !important; }
    .cat.open, .cat { }
    .caret { display: none !important; }

    /* Category */
    .cat {
        box-shadow: none !important;
        border: 1.5px solid #333 !important;
        border-radius: 4px !important;
        margin-bottom: 12px !important;
        page-break-inside: auto;
        page-break-before: auto;
    }
    .cat-head {
        background: #eee !important;
        padding: 6px 10px !important;
        border-bottom: 1px solid #333 !important;
        page-break-after: avoid;
    }
    .cat-head .ti { font-size: 13pt !important; }
    .cat-head .emoji { font-size: 14pt !important; }
    .cat-head .meta span { background: #fff !important; border: 1px solid #999 !important; color: #000 !important; }
    .cat-body { padding: 8px 10px !important; }

    .cat-overview {
        background: #f5f5f5 !important;
        border-left: 2px solid #333 !important;
        padding: 6px 10px !important;
        font-size: 10pt !important;
        page-break-after: avoid;
    }
    .cat-overview b { color: #000 !important; }

    .cat-strategies {
        background: #fafafa !important;
        border-left: 2px solid #666 !important;
        padding: 6px 10px !important;
        page-break-inside: avoid;
    }
    .cat-strategies h4 { font-size: 9pt !important; color: #000 !important; }
    .cat-strategies li { font-size: 10pt !important; }
    .cat-strategies b { color: #000 !important; }

    /* Knowledge point */
    .kp {
        border: 1px solid #999 !important;
        margin-bottom: 8px !important;
        page-break-inside: auto;
    }
    .kp-head {
        background: #f0f0f0 !important;
        padding: 5px 8px !important;
        border-bottom: 1px solid #999 !important;
        page-break-after: avoid;
    }
    .kp-head .idx {
        background: #333 !important;
        color: #fff !important;
        width: 18px !important;
        height: 18px !important;
    }
    .kp-head .name { font-size: 11pt !important; }
    .kp-head .count { background: #fff !important; border: 1px solid #999 !important; }
    .kp-body { padding: 6px 8px !important; }

    .kp-analysis {
        background: #f8f8f8 !important;
        border-left: 2px solid #333 !important;
        color: #000 !important;
        padding: 5px 8px !important;
        font-size: 10pt !important;
        page-break-inside: avoid;
    }
    .kp-analysis h5 { color: #000 !important; }
    .kp-tips {
        background: #fafafa !important;
        border-left: 2px solid #666 !important;
        padding: 5px 8px !important;
        page-break-inside: avoid;
    }
    .kp-tips h5 { color: #000 !important; }
    .kp-tips b { color: #000 !important; }

    /* Example */
    .ex {
        background: #fff !important;
        border: 1px solid #999 !important;
        border-left: 3px solid #333 !important;
        padding: 6px 10px !important;
        margin-bottom: 6px !important;
        page-break-inside: avoid;
    }
    .ex-head { gap: 6px !important; }
    .ex-badge { background: #333 !important; color: #fff !important; padding: 1px 7px !important; }
    .ex-stars { color: #000 !important; }
    .ex-title { font-size: 11pt !important; }
    .ex-q {
        background: #f8f8f8 !important;
        padding: 5px 8px !important;
        font-size: 10pt !important;
    }
    .ex-q b { color: #000 !important; }
    .ex-steps {
        background: #fafafa !important;
        padding: 5px 8px !important;
        page-break-inside: avoid;
    }
    .ex-steps h6 { color: #000 !important; }
    .ex-steps li { font-size: 9.5pt !important; color: #000 !important; }
    .ex-steps li b { color: #000 !important; }
    .ex-steps code {
        background: #eee !important;
        border: 1px solid #ccc !important;
        color: #000 !important;
        padding: 0 3px !important;
        font-size: 9pt !important;
    }

    .ex-ans {
        background: #e0e0e0 !important;
        color: #000 !important;
        border: 1.5px solid #333 !important;
        padding: 2px 8px !important;
        font-size: 10pt !important;
    }
    .ex-takeaway {
        background: #fafafa !important;
        border-left: 2px solid #666 !important;
        padding: 4px 8px !important;
        font-size: 9pt !important;
        color: #000 !important;
    }
    .ex-takeaway b { color: #000 !important; }

    .practice {
        background: #f5f5f5 !important;
        border: 1px dashed #666 !important;
        padding: 6px 10px !important;
        page-break-inside: avoid;
    }
    .practice h5 { color: #000 !important; }
    .practice li { font-size: 10pt !important; color: #000 !important; }

    /* Page break hints */
    .cat { page-break-before: auto; }
    .cat:first-of-type { page-break-before: avoid; }

    /* Hide buttons / tooltips that don't make sense in print */
    button, .caret { display: none !important; }

    /* URL in footer (optional) */
    a[href]:after { content: ''; } /* don't print URLs */
}

/* Mobile */
@media (max-width: 768px) {
    header { padding: 16px; }
    header h1 { font-size: 18px; }
    main { padding: 14px; }
    .cat-head { padding: 12px 14px; }
    .cat-head .ti { font-size: 15px; }
    .cat-head .emoji { font-size: 22px; }
    .cat-body { padding: 12px 14px; }
    .kp-head { padding: 10px 12px; font-size: 13px; }
    .kp-body { padding: 10px 12px; }
    .ex { padding: 10px 12px; }
}
</style>
</head>
<body>

<header>
    <div class="hd-row">
        <h1><span>📚</span> AK4 知识点扩展教学</h1>
        <span class="sub">10 大类 · 61 知识点 · 200+ 原创例题</span>
        <div class="map-switch">
            <a href="index.html">📐 教材</a>
            <a href="german.html">🏆 德国</a>
            <a href="pangu.html">🎨 盘古</a>
            <a href="sweden-provinces.html">🗺️ 瑞典</a>
            <a href="knowledge-points.html">📊 题库分析</a>
            <span class="active">📚 AK4 教学</span>
            <a href="german-pangu-ak34.html">🇩🇪 德国题集</a>
        </div>
    </div>
    <nav class="toc" id="toc"></nav>
</header>

<div class="print-bar">
    <b>🖨️ 打印 / 导出 PDF</b>
    <select class="print-select" id="print-scope" title="选择要打印的内容范围">
        <option value="all">全部 10 大类</option>
        <option value="examples">只打印例题（省策略/要点）</option>
        <option value="strategies">只打印考点+策略（省例题）</option>
    </select>
    <select class="print-select" id="print-cat" title="只打印某个大类">
        <option value="all">范围：全部大类</option>
    </select>
    <label style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;color:#BF360C;font-weight:600;">
        <input type="checkbox" id="print-hide-ans" style="cursor:pointer;">
        隐藏答案（试卷模式）
    </label>
    <button class="print-btn secondary" onclick="presetExamMode()" title="一键切换到试卷模式：只例题 + 隐藏答案">
        📝 试卷模式
    </button>
    <button class="print-btn" onclick="doPrint()">🖨️ 立即打印</button>
    <button class="print-btn secondary" onclick="savePdf()">💾 保存为 PDF</button>
    <span class="hint">💡 <b>Ctrl+P</b> 也行；A4 纵向；<b>试卷模式</b> 每题留答题线</span>
</div>

                    q: '一列 200 m 长的火车以 20 m/s 过一座 400 m 长的桥，用多长时间？',
                    steps: [
                        '"过桥"= 车头进入到车尾离开',
                        '总路程 = 桥长 + 车长 = 400 + 200 = <code>600 m</code>',
                        '时间 = 600 ÷ 20 = <code>30 秒</code>'
                    ],
                    ans: '30 秒',
                    takeaway: '<b>过桥</b> 时火车要走完"车长 + 桥长"的距离。'
                },
                {
                    title: '例 4 · 追及',
                    stars: 4,
                    q: 'A 先出发走路（4 km/h），1 小时后 B 骑车（12 km/h）追。多久追上？',
                    steps: [
                        'A 领先：4 × 1 = <code>4 km</code>',
                        '速度差：12 − 4 = 8 km/h',
                        '追及时间：4 ÷ 8 = <code>0.5 小时 = 30 分</code>'
                    ],
                    ans: '30 分钟',
                    takeaway: '<b>追及</b>：追上时间 = 领先距离 ÷ 速度差。'
                }
            ],
            practice: [
                '每小时 50 km，4 小时走多远？',
                'A 和 B 相距 60 km 相向而行，A 走 5 B 走 7 km/h，几小时相遇？',
                '一辆 100 m 火车过 500 m 桥，速度 20 m/s，用多久？'
            ]
        }
    ]
},

];

// ============== RENDERER ==============
function renderToc() {
    const toc = document.getElementById('toc');
    toc.innerHTML = AK4.map(c =>
        `<a href="#cat-${c.slug}">${c.emoji} ${c.cat}</a>`
    ).join('');
}

function renderContent() {
    const el = document.getElementById('content');
    el.innerHTML = AK4.map(c => `
        <section class="cat open" id="cat-${c.slug}">
            <header class="cat-head" onclick="toggleCat(this)">
                <span class="emoji">${c.emoji}</span>
                <span class="ti">${c.cat}</span>
                <span class="meta">
                    <span>${c.points.length} 知识点</span>
                    <span>${c.points.reduce((s,p)=>s+p.examples.length,0)} 例题</span>
                </span>
                <span class="caret">▸</span>
            </header>
            <div class="cat-body">
                <div class="cat-overview">${c.overview}</div>
                <div class="cat-strategies">
                    <h4>🧭 ${c.cat} 核心策略</h4>
                    <ul>${c.strategies.map(s=>`<li>${s}</li>`).join('')}</ul>
                </div>
                ${c.points.map((p,i)=>renderKP(p,i+1)).join('')}
            </div>
        </section>
    `).join('');
}

function renderKP(p, idx) {
    return `<div class="kp">
        <div class="kp-head" onclick="toggleEl(this)">
            <span class="idx">${idx}</span>
            <span class="name">${p.name}</span>
            <span class="count">${p.examples.length} 例</span>
            <span class="caret">▸</span>
        </div>
        <div class="kp-body">
            <div class="kp-analysis">
                <h5>📋 考点分析</h5>
                ${p.analysis}
            </div>
            ${p.tips && p.tips.length ? `
                <div class="kp-tips">
                    <h5>💡 关键要点</h5>
                    <ul>${p.tips.map(t=>`<li>${t}</li>`).join('')}</ul>
                </div>` : ''}
            ${p.examples.map((e,i)=>renderEx(e,i+1)).join('')}
            ${p.practice && p.practice.length ? `
                <div class="practice">
                    <h5>✏️ 变式练习（无答案，自测）</h5>
                    <ol>${p.practice.map(ex=>`<li>${ex.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</li>`).join('')}</ol>
                </div>` : ''}
        </div>
    </div>`;
}

function renderEx(e, i) {
    const q = e.q.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
    const steps = e.steps.map(s =>
        `<li>${s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</li>`
    ).join('');
    return `<div class="ex">
        <div class="ex-head">
            <span class="ex-badge">例 ${i}</span>
            <span class="ex-stars">${'⋆'.repeat(e.stars||1)}</span>
            <span class="ex-title">${e.title||''}</span>
        </div>
        <div class="ex-q">📄 ${q}</div>
        <div class="ex-steps">
            <h6>🔎 解题步骤</h6>
            <ol>${steps}</ol>
        </div>
        <span class="ex-ans">✓ 答案：${e.ans}</span>
        ${e.takeaway ? `<div class="ex-takeaway"><b>💡 要点</b>：${e.takeaway}</div>` : ''}
    </div>`;
}

function toggleCat(el) {
    el.closest('.cat').classList.toggle('open');
}
function toggleEl(el) {
    el.closest('.kp').classList.toggle('open');
}

// ============== PRINT ==============
function populatePrintCatSelector() {
    const sel = document.getElementById('print-cat');
    AK4.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.slug;
        opt.textContent = `仅打印：${c.emoji} ${c.cat}`;
        sel.appendChild(opt);
    });
}

function applyPrintSettings() {
    const scope = document.getElementById('print-scope').value;
    const cat = document.getElementById('print-cat').value;
    const hideAns = document.getElementById('print-hide-ans').checked;

    // Clear filter classes
    document.body.classList.remove(
        'print-filter-no-practice',
        'print-filter-no-takeaway',
        'print-filter-no-tips',
        'print-filter-no-overview',
        'print-hide-answers'
    );

    if (scope === 'examples') {
        document.body.classList.add('print-filter-no-tips');
    } else if (scope === 'strategies') {
        document.querySelectorAll('.ex, .practice').forEach(e => e.classList.add('print-hidden'));
    } else {
        document.querySelectorAll('.ex, .practice').forEach(e => e.classList.remove('print-hidden'));
    }

    // Hide answers (试卷模式)
    if (hideAns) {
        document.body.classList.add('print-hide-answers');
    }

    // Category filter
    document.querySelectorAll('.cat').forEach(el => {
        if (cat === 'all' || el.id === 'cat-' + cat) {
            el.classList.remove('print-hidden');
            el.classList.add('open');
        } else {
            el.classList.add('print-hidden');
        }
    });

    // Force-expand every KP for print
    document.querySelectorAll('.kp').forEach(el => el.classList.add('open'));
}

function presetExamMode() {
    document.getElementById('print-scope').value = 'examples';
    document.getElementById('print-hide-ans').checked = true;
    applyPrintSettings();
    alert('📝 已切换到试卷模式：\n\n' +
          '✓ 只打印例题（省考点+策略）\n' +
          '✓ 隐藏答案 + 解题步骤 + 要点\n' +
          '✓ 每题自动留出答题线\n\n' +
          '点击"立即打印"或 Ctrl+P 继续。');
}

function doPrint() {
    applyPrintSettings();
    // Wait a frame for DOM updates
    setTimeout(() => window.print(), 50);
}

function savePdf() {
    applyPrintSettings();
    alert(
        '💡 保存为 PDF 的方法：\n\n' +
        '1. 下一步会打开打印预览\n' +
        '2. 在"目标打印机"中选择 "另存为 PDF" 或 "Microsoft Print to PDF"\n' +
        '3. 点击保存\n\n' +
        'A4 纵向、页边距 15mm 已在样式里设好。'
    );
    setTimeout(() => window.print(), 50);
}


// INIT
renderToc();
renderContent();
populatePrintCatSelector();
</script>
</body>
</html>
